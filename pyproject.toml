[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphwar-sim"
version = "0.1.0"
description = "Headless, faithful reimplementation of the artillery game Graphwar (NORMAL_FUNC mode) with golden tests against the GPL Java reference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew12045" }]
keywords = ["game", "simulation", "artillery", "clean-room"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",  # TestClient transport for tests/test_ui_server.py
]
llm = [
    "anthropic>=0.40",  # optional: only agents/llm_agent.py imports it (lazily)
]

[tool.setuptools.packages.find]
include = ["graphwar_sim*", "agents*", "eval*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["graphwar_sim"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# agents/llm_agent.py imports the anthropic SDK lazily (optional dependency);
# it must typecheck with or without the extra installed.
module = "anthropic.*"
ignore_missing_imports = true
