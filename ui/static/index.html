<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Graphwar</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Tick labels: baked into backGame.png in the reference
         (docs/UI_GROUND_TRUTH.md §2.3) -->
    <div class="tick" id="tick-top">15</div>
    <div class="tick" id="tick-bottom">-15</div>
    <div class="tick" id="tick-left">-25</div>
    <div class="tick" id="tick-right">25</div>

    <canvas id="plane" width="770" height="450"></canvas>
    <canvas id="compass" width="200" height="113"></canvas>
    <div id="angle-box"></div>

    <!-- y = label image (rsc/y.png at (125,468)) -->
    <div id="y-label">y =</div>
    <input id="func" type="text" autocomplete="off" spellcheck="false" aria-label="function y = f(x)">

    <button id="fire" class="gbutton">Fire</button>
    <!-- Occupies the reference's global-room slot (GameScreen.txt:55-59),
         hidden in local games there; repurposed as New Match here. -->
    <button id="new-match" class="gbutton small">New Match</button>
    <button id="quit" class="gbutton">Quit</button>

    <!-- TEXTBOXGAME rectangle, repurposed chat -> turn log (§8) -->
    <div id="log" aria-live="polite"></div>
    <!-- TEXTFIELD rectangle, repurposed chat input -> seed input -->
    <input id="seed" type="text" autocomplete="off" placeholder="Seed (optional) — used by New Match">

    <div id="overlay" class="hidden">
      <div id="overlay-panel">
        <div id="overlay-msg"></div>
        <div id="overlay-buttons"></div>
      </div>
    </div>
    <div id="think-bubble" class="hidden"></div>
  </div>

  <!-- M5.4 spectator controls (below the 800x600 game box; nothing inside
       #app is repositioned). Modes map 1:1 to the eval roster entries;
       "LLM" composes the wire string llm:<model> and "LLM Plan" hybrid:<model>
       (M5.5); the Persona dropdown appends "@<persona>" to either. -->
  <div id="controls">
    <div id="setup-panel" class="panel">
      <span class="setup-group">
        <label for="mode-team1">Player 1</label>
        <select id="mode-team1">
          <option value="human" selected>Human</option>
          <option value="solver">Solver</option>
          <option value="random">Random</option>
          <option value="straight">Straight Shot</option>
          <option value="67">Bot 67</option>
          <option value="llm">LLM</option>
          <option value="hybrid">LLM Plan</option>
        </select>
        <input id="model-team1" type="text" class="hidden" spellcheck="false" value="qwen3.8-27b-fp8" aria-label="LLM model for Player 1">
        <select id="persona-team1" class="hidden" aria-label="Persona for Player 1">
          <option value="none" selected>Persona: none</option>
          <option value="sniper">Sniper</option>
          <option value="howitzer">Howitzer</option>
          <option value="serpent">Serpent</option>
          <option value="bodyguard">Bodyguard</option>
          <option value="professor">Professor</option>
          <option value="master_magician">Master Magician</option>
        </select>
      </span>
      <span class="setup-group">
        <label for="mode-team2">Player 2</label>
        <select id="mode-team2">
          <option value="human" selected>Human</option>
          <option value="solver">Solver</option>
          <option value="random">Random</option>
          <option value="straight">Straight Shot</option>
          <option value="67">Bot 67</option>
          <option value="llm">LLM</option>
          <option value="hybrid">LLM Plan</option>
        </select>
        <input id="model-team2" type="text" class="hidden" spellcheck="false" value="qwen3.8-27b-fp8" aria-label="LLM model for Player 2">
        <select id="persona-team2" class="hidden" aria-label="Persona for Player 2">
          <option value="none" selected>Persona: none</option>
          <option value="sniper">Sniper</option>
          <option value="howitzer">Howitzer</option>
          <option value="serpent">Serpent</option>
          <option value="bodyguard">Bodyguard</option>
          <option value="professor">Professor</option>
          <option value="master_magician">Master Magician</option>
        </select>
      </span>
      <span class="setup-group">
        <label for="max-turns">Max turns</label>
        <!-- # TUNABLE — not from source: conservative for live-API agent
             loops (eval's MatchConfig 100 is a batch number). -->
        <input id="max-turns" type="number" min="1" value="30">
      </span>
      <span class="setup-hint">drivers apply at once; New Match resets the board</span>
    </div>
    <div id="playback-bar" class="panel">
      <button id="play-pause" class="gbutton small">Play</button>
      <button id="step" class="gbutton small">Step</button>
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
